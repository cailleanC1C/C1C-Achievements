name: Sheets Telemetry Validation

on:
  pull_request:
    paths:
      - "achievements/sheets_telemetry.py"
      - "achievements/__init__.py"
      - "tests/test_sheets_telemetry.py"
      - ".github/workflows/sheets-telemetry-validation.yml"

permissions:
  contents: read

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install gspread==6.1.2 pytest
      - name: Run Sheets telemetry tests
        run: pytest -q tests/test_sheets_telemetry.py
