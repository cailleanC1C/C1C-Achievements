name: PR88 Sheets Telemetry Validation

on:
  pull_request:
    branches: [main]

jobs:
  focused-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest gspread==6.1.2
      - name: Run broker and telemetry tests
        run: |
          pytest -q tests/test_sheets_read_broker.py tests/test_sheets_telemetry.py
