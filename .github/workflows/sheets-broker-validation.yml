name: Sheets Broker Validation

on:
  pull_request:
    paths:
      - "achievements/sheets_read_broker.py"
      - "achievements/__init__.py"
      - "tests/test_sheets_read_broker.py"
      - ".github/workflows/sheets-broker-validation.yml"

permissions:
  contents: read

jobs:
  broker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install gspread==6.1.2 pytest
      - name: Run Sheets broker tests
        run: pytest -q tests/test_sheets_read_broker.py
